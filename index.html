<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3e9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Mon Budget">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Mon Budget</title>
<style>
:root{--paper:#f7f3e9;--card:#fffefa;--ink:#1c2a22;--muted:#68746c;--green:#37664e;--green2:#47775b;--line:#ded9cc;--sand:#eee7d6;--orange:#d4875d;--shadow:0 8px 24px #3028170d}
*{box-sizing:border-box}html{background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 18px calc(106px + env(safe-area-inset-bottom));max-width:760px;margin:auto}
button,input,select{font:inherit}button{cursor:pointer;border:0}
.topline{font-size:12px;letter-spacing:3px;color:#a1a397;margin:24px 4px 10px;text-transform:uppercase}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:0 0 24px}.monthbar h1{font-family:Georgia,serif;font-size:clamp(31px,8vw,48px);letter-spacing:-1.6px;margin:0;text-align:center;white-space:nowrap}.monthbtn{width:52px;height:52px;border-radius:50%;background:#eee7d6;color:var(--ink);font-size:28px;display:grid;place-items:center;flex-shrink:0}
.totalcard{background:var(--green);color:#fffaf0;border-radius:30px;padding:27px 28px;margin-bottom:18px}.eyebrow{font-size:16px;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}.totalcard .eyebrow{color:#d4dfd4}.totalnum{font-family:Georgia,serif;font-size:clamp(42px,11vw,65px);font-weight:600;letter-spacing:-2px;margin:8px 0 2px}.totalnote{font-size:17px;color:#d7e1d8}
.summary{background:var(--card);border:2px solid var(--line);border-radius:27px;padding:22px 26px;margin-bottom:16px;box-shadow:var(--shadow)}.summary .amount{font-family:Georgia,serif;font-size:34px;font-weight:700;margin-top:8px;display:inline-block;border-bottom:2px dotted var(--ink)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 42px}.metric{min-height:132px;background:var(--card);border:2px solid var(--line);border-radius:27px;padding:22px 25px;box-shadow:var(--shadow)}.metric .amount{font-family:Georgia,serif;font-size:clamp(26px,6vw,37px);font-weight:700;margin-top:12px;white-space:nowrap}.metric.green .amount{color:var(--green)}
.section-title{font-size:15px;letter-spacing:4px;color:var(--muted);text-transform:uppercase;margin:0 0 18px}
.category-card{background:var(--card);border:2px solid var(--line);border-radius:27px;padding:22px 25px;margin-bottom:15px;box-shadow:var(--shadow)}.cat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:21px}.cat-name{display:flex;align-items:center;gap:13px}.emoji{font-size:25px}.pct{font-size:17px;color:var(--muted);font-weight:600}.bar{height:9px;border-radius:10px;background:#eee9dd;margin:18px 0 13px;overflow:hidden}.bar i{display:block;height:100%;border-radius:10px;background:var(--green)}.cat-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:17px}.cat-spent{font-family:Georgia,serif;font-size:26px;font-weight:700}.cat-budget{color:var(--muted);text-align:right}
.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fffefaef;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:760px;margin:auto}.tabs button{flex:1;border-radius:40px;background:transparent;color:#657168;padding:15px 10px;font-size:18px}.tabs button.active{background:var(--green);color:white}
.fab{position:fixed;z-index:7;right:max(24px,calc((100vw - 720px)/2 + 24px));bottom:calc(105px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;background:var(--orange);color:white;font-size:46px;box-shadow:0 8px 20px #4b34252b;display:grid;place-items:center}
.page{display:none}.page.active{display:block}.detail-head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 15px;font-family:Georgia,serif;font-size:25px}.detail-group{margin:25px 0}.detail-group-head{display:flex;justify-content:space-between;align-items:center;font-family:Georgia,serif;font-weight:700;font-size:24px;margin-bottom:12px}.transaction-list{background:var(--card);border:2px solid var(--line);border-radius:27px;overflow:hidden}.transaction{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 22px;border-bottom:1px solid var(--line);min-height:78px}.transaction:last-child{border-bottom:0}.tx-label{font-size:18px}.tx-date{font-size:14px;color:var(--muted);margin-top:4px}.tx-right{display:flex;align-items:center;gap:13px;white-space:nowrap;font-size:18px}.delete{background:transparent;color:#7d827b;font-size:18px;padding:6px}
.empty{padding:25px;text-align:center;color:var(--muted);font-size:15px}.add-category{margin:5px 0 20px;background:transparent;color:var(--green);font-weight:700;padding:8px 0;font-size:16px}
.modal{position:fixed;inset:0;background:#1b251f77;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:var(--paper);width:100%;max-width:760px;margin:auto auto 0;border-radius:28px 28px 0 0;padding:23px 22px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h2{font-family:Georgia,serif;font-size:28px;margin:0 0 16px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.field input,.field select{width:100%;padding:14px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:17px}.form-actions{display:flex;gap:10px;margin-top:20px}.form-actions button{flex:1;border-radius:30px;padding:15px;background:var(--green);color:white;font-weight:650}.form-actions .cancel{background:#e9e3d6;color:var(--ink)}
.type-switch{display:flex;background:#ece6d9;border-radius:14px;padding:4px;gap:4px}.type-switch button{flex:1;padding:11px;border-radius:11px;background:transparent;color:var(--muted)}.type-switch button.active{background:white;color:var(--green);box-shadow:var(--shadow)}
@media(min-width:600px){body{padding-left:28px;padding-right:28px}.fab{right:calc((100vw - 704px)/2 + 24px)}}
</style></head>
<body>
<div class="page active" id="budgetPage">
<div class="topline">Mon budget</div>
<div class="monthbar"><button class="monthbtn" onclick="shiftMonth(-1)">‹</button><h1 id="monthTitle">Novembre 2026</h1><button class="monthbtn" onclick="shiftMonth(1)">›</button></div>
<div class="totalcard"><div class="eyebrow">Total dépensé</div><div class="totalnum" id="totalSpent">0,00 €</div><div class="totalnote" id="totalNote">sur 0,00 € de budget (hors épargne)</div></div>
<div class="summary"><div class="eyebrow">Compte au début du mois</div><div class="amount" id="openingBalance">0,00 €</div></div>
<div class="metrics">
<div class="metric"><div class="eyebrow">Revenus</div><div class="amount" id="incomeMetric">0,00 €</div></div>
<div class="metric"><div class="eyebrow">Épargne</div><div class="amount" id="savingMetric">0,00 €</div></div>
<div class="metric"><div class="eyebrow">Dépenses exceptionnelles</div><div class="amount" id="exceptionMetric">0,00 €</div></div>
<div class="metric green"><div class="eyebrow">Reste à vivre</div><div class="amount" id="remainingMetric">0,00 €</div></div>
</div>
<div class="section-title">Catégories</div><div id="categoryCards"></div>
<button class="add-category" onclick="openCategory()">＋ Ajouter une catégorie</button>
</div>
<div class="page" id="expensesPage">
<div class="section-title" style="margin-top:35px">Détail des dépenses</div>
<div class="monthbar"><button class="monthbtn" onclick="shiftMonth(-1)">‹</button><h1 id="monthTitle2">Novembre 2026</h1><button class="monthbtn" onclick="shiftMonth(1)">›</button></div>
<div id="expenseDetails"></div>
</div>
<button class="fab" onclick="openTransaction()" aria-label="Ajouter une opération">＋</button>
<nav class="tabs"><button class="active" data-page="budgetPage">Budget</button><button data-page="expensesPage">Dépenses</button></nav>
<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">Ajouter</h2><div id="modalBody"></div><div class="form-actions"><button class="cancel" onclick="closeModal()">Annuler</button><button id="modalSave">Enregistrer</button></div></div></div>
<script src="app.js"></script></body></html>
