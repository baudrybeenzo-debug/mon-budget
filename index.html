<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17251f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon Budget">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Mon Budget</title>
<style>
:root{--bg:#f4f5f1;--card:#fff;--ink:#1d2923;--muted:#78827b;--accent:#315b48;--line:#e7ebe6;--red:#b84c4c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px calc(84px + env(safe-area-inset-bottom));max-width:680px;margin:auto}
header{padding:22px 4px 14px;display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:0;font-weight:750;letter-spacing:-.7px}.sub{color:var(--muted);font-size:13px;margin-top:5px}
select,input,button{font:inherit}button{border:0;border-radius:13px;padding:12px 15px;background:var(--accent);color:white;font-weight:650;cursor:pointer}button.secondary{background:#e8eee9;color:var(--accent)}button.danger{background:#f8e9e8;color:var(--red)}
.month{border:1px solid var(--line);background:white;border-radius:12px;padding:9px;color:var(--ink)}
.hero{background:#1d382c;color:white;border-radius:22px;padding:22px;margin:10px 0 16px}.hero small{opacity:.75}.balance{font-size:34px;font-weight:750;margin:8px 0 17px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats div{background:#ffffff16;padding:12px;border-radius:13px}.stats strong{display:block;font-size:18px;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:12px 0}.tile,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px}.tile span{font-size:12px;color:var(--muted)}.tile strong{display:block;font-size:20px;margin-top:6px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:23px 2px 10px}h2{font-size:18px;margin:0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.muted{color:var(--muted);font-size:13px}.bar{height:7px;background:#edf0ec;border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#6c9a7e;border-radius:9px}.row-right{text-align:right;white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:5}nav button{background:transparent;color:var(--muted);padding:7px 10px;font-size:12px}nav button.active{color:var(--accent);background:#e8eee9}
.page{display:none}.page.active{display:block}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;color:var(--muted)}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink)}.form-actions{display:flex;gap:8px;margin-top:14px}.form-actions button{flex:1}.pill{font-size:11px;background:#edf2ee;color:var(--accent);padding:5px 8px;border-radius:20px}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;z-index:10}.modal.open{display:flex}.sheet{background:var(--bg);width:100%;max-width:680px;margin:auto auto 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));border-radius:23px 23px 0 0;max-height:90vh;overflow:auto}.sheet h2{margin-bottom:12px}.empty{color:var(--muted);text-align:center;padding:24px 8px}
</style>
</head>
<body>
<header><div><h1>Mon Budget</h1><div class="sub">Ton argent, en toute simplicité.</div></div><input class="month" id="month" type="month" aria-label="Mois"></header>
<section class="page active" id="home">
<div class="hero"><small>Reste après budgets et dépenses</small><div class="balance" id="remaining">—</div><div class="stats"><div><small>Revenus</small><strong id="incomeTotal">—</strong></div><div><small>Dépenses</small><strong id="spentTotal">—</strong></div></div></div>
<div class="grid"><div class="tile"><span>Budgets prévus</span><strong id="budgetTotal">—</strong></div><div class="tile"><span>Épargne enregistrée</span><strong id="savingTotal">—</strong></div></div>
<div class="section-head"><h2>Mes budgets</h2><button class="secondary" onclick="openBudget()">Modifier</button></div><div class="panel" id="budgetList"></div>
<div class="section-head"><h2>Dernières dépenses</h2><button onclick="openExpense()">+ Ajouter</button></div><div class="panel" id="recentList"></div>
</section>
<section class="page" id="expenses"><div class="section-head"><h2>Dépenses</h2><button onclick="openExpense()">+ Ajouter</button></div><div class="panel" id="expenseList"></div></section>
<section class="page" id="savings"><div class="section-head"><h2>Épargne</h2><button onclick="openSaving()">+ Mouvement</button></div><div class="panel"><div class="muted">Solde d'épargne du mois</div><div class="balance" style="color:var(--ink)" id="savingPageTotal">0 €</div><div class="muted">Enregistre ici tes versements et retraits.</div></div><div class="panel" id="savingList" style="margin-top:12px"></div></section>
<section class="page" id="settings"><div class="section-head"><h2>Paramètres</h2></div><div class="panel">
<div class="field"><label>Salaire mensuel (€)</label><input id="salary" type="number" min="0"></div><div class="field"><label>Pension (€)</label><input id="pension" type="number" min="0"></div><div class="field"><label>CAF (€)</label><input id="caf" type="number" min="0"></div><div class="field"><label>Objectif d'épargne mensuel (€)</label><input id="goal" type="number" min="0"></div><button onclick="saveSettings()">Enregistrer les revenus</button>
<hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><button class="secondary" onclick="exportData()">Exporter une sauvegarde</button><div class="field"><label>Restaurer une sauvegarde JSON</label><input id="importFile" type="file" accept="application/json"></div><button class="danger" onclick="resetData()">Réinitialiser toutes les données</button></div></section>
<nav><button class="active" data-page="home">⌂<br>Accueil</button><button data-page="expenses">↗<br>Dépenses</button><button data-page="savings">◎<br>Épargne</button><button data-page="settings">⚙<br>Réglages</button></nav>
<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">Ajouter</h2><div id="modalBody"></div><div class="form-actions"><button class="secondary" onclick="closeModal()">Annuler</button><button id="modalSave">Enregistrer</button></div></div></div>
<script src="app.js"></script>
</body></html>
